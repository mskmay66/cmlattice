site_name: cmlattice
site_description: A simple command line tool for running Coupled Map Lattice simulations.
site_author: Michael May
site_url: https://mskmay66.github.io/cmlattice/
repo_url: https://github.com/mskmay66/cmlattice
repo_name: cmlattice
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
  - User Guide:
      - CoupledMapLattice: cml.md
      - KenekoLattice: kaneko.md
      - RulkovLattice: rulkov.md
      - Visualization: visualization.md
      - Examples: examples.md
  - Contributing: contributing.md

theme:
  name: material
  logo: assets/logo.png
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode

    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
markdown_extensions:
  - footnotes

extra_css:
  - stylesheets/extra.css
